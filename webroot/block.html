<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Access Blocked</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #5f6b7a;
        --border: #d7dee8;
        --accent: #c2410c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101827;
          --panel: #162033;
          --text: #f8fafc;
          --muted: #cbd5e1;
          --border: #334155;
          --accent: #fb923c;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--accent);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.8rem;
      }

      .status::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      dl {
        margin: 26px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      dt {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Network policy</div>
      <h1>Access Blocked</h1>
      <p>This destination is blocked by the network policy currently applied to this connection.</p>
      <p>If you believe this is incorrect, contact the network administrator and include the requested URL below.</p>
      <dl>
        <dt>Requested URL</dt>
        <dd>{{ .RequestedURL }}</dd>
      </dl>
    </main>
  </body>
</html>
